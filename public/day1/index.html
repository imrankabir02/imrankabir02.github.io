<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in the Cosmic Void</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="void-canvas"></canvas>

  <div class="glow-orb glow-top"></div>
  <div class="glow-orb glow-bottom"></div>

  <main class="viewport-wrapper">
    <div class="glass-card">
      <div class="badge">
        <span class="pulse-dot"></span>
        <span class="badge-text">Deep Space Anomaly</span>
      </div>

      <h1 class="glitch-title" data-text="404">404</h1>

      <h2 class="headline">Lost in the Celestial Void</h2>
      <p class="description">
        The coordinates you entered collapsed beyond the event horizon.
        There is nothing here except cold dust and starlight.
      </p>

      <div class="actions">
        <a href="../" class="btn btn-primary">
          <span>Return to Orbit</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
        <button class="btn btn-secondary" onclick="window.history.back()">
          Recalibrate Path
        </button>
      </div>

      <div class="footer-telemetry">
        <span>ERROR_CODE: 0x0000404_VOID</span>
        <span class="separator">/</span>
        <span>LATENCY: ∞ ms</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
