<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!-- __SITE_CSS__ is substituted by scripts/generate-og.mjs with the
         hashed stylesheet from the current build, so the card always uses the
         same Newsreader / Inter / JetBrains Mono files the site itself ships. -->
    <link rel="stylesheet" href="__SITE_CSS__" />
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
        background: #f7f6f3; color: #1a1c1f;
        font-family: Inter, "Inter Fallback", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .serif { font-family: Newsreader, "Newsreader Fallback", Georgia, serif; font-optical-sizing: auto; }
      .mono { font-family: "JetBrains Mono", "JetBrains Mono Fallback", monospace; }
      .wrap {
        position: relative; width: 100%; height: 100%; box-sizing: border-box;
        padding: 60px 72px 56px; display: flex; flex-direction: column;
        justify-content: space-between;
      }
      /* Same graph-paper grid as the site masthead. */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(26,28,31,.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(26,28,31,.05) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(ellipse 85% 75% at 30% 0%, #000 15%, transparent 80%);
                mask-image: radial-gradient(ellipse 85% 75% at 30% 0%, #000 15%, transparent 80%);
      }
      .row {
        position: relative; display: flex; align-items: center;
        justify-content: space-between; padding-bottom: 22px;
        border-bottom: 1px solid rgba(26,28,31,.14);
      }
      .label { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #686f78; }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 999px; background: #157f3d; margin-right: 12px; vertical-align: middle; }
      h1 {
        position: relative; margin: 0; font-size: 92px; font-weight: 500;
        letter-spacing: -0.02em; line-height: 1; color: #1a1c1f;
      }
      .bar { position: relative; margin-top: 30px; width: 84px; height: 4px; background: #1f488c; }
      .deck {
        position: relative; margin: 28px 0 0; max-width: 920px;
        font-style: italic; font-size: 30px; line-height: 1.45; color: #494f57;
      }
      .strip {
        position: relative; display: flex; align-items: center;
        justify-content: space-between; padding-top: 22px;
        border-top: 1px solid rgba(26,28,31,.14);
      }
      .stack { font-size: 16px; letter-spacing: -0.01em; color: #494f57; }
      .stack b { color: #1f488c; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="grid"></div>

      <div class="row">
        <div class="label mono">Backend Engineer · Bagerhat, Bangladesh</div>
        <div class="label mono"><span class="dot"></span>IT Engineer at BIFPCL</div>
      </div>

      <div style="position: relative">
        <h1 class="serif">Mridha Imran Kabir</h1>
        <div class="bar"></div>
        <p class="deck serif">
          Multi-tenant data isolation, background jobs that survive bad input,
          and queries that stay fast as the data grows.
        </p>
      </div>

      <div class="strip">
        <div class="stack mono">Django <b>·</b> FastAPI <b>·</b> Laravel <b>·</b> PostgreSQL <b>·</b> Celery <b>·</b> Docker</div>
        <div class="label mono">imrankabir02.github.io</div>
      </div>
    </div>
  </body>
</html>
